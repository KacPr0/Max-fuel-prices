name: Bot Cen Paliw PL

on:
  schedule:
    # Co 15 minut w godzinach 8:00-15:45 UTC (zimą 9:00-16:45, latem 10:00-17:45 czasu polskiego).
    # W tym czasie Minister Energii publikuje w Monitorze Polskim ceny maksymalne na kolejny dzień.
    - cron: '*/15 8-15 * * *'
  
  # Umożliwia ręczne uruchomienie bota jednym kliknięciem bezpośrednio z interfejsu GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4
        with:
          # Wymagane, aby zachować pełną historię commitów do późniejszego zapisu stanu bota
          fetch-depth: 0

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Gdy ceny na jutro są już opublikowane, pomijamy instalację i uruchomienie (oszczędza minuty Actions).
      - name: Sprawdzenie, czy ceny na jutro są już opublikowane
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node -e "
            const db = require('./db.json');
            const tomorrow = new Date(Date.now() + 864e5).toLocaleDateString('sv-SE', { timeZone: 'Europe/Warsaw' });
            const skip = process.env.EVENT_NAME !== 'workflow_dispatch' && db.lastPublishedMaxPriceDate >= tomorrow;
            console.log('skip=' + skip);
          " >> "$GITHUB_OUTPUT"

      - name: Instalacja zależności
        if: steps.check.outputs.skip != 'true'
        run: npm install

      # Font Inter do grafik (bez niego grafika i tak powstanie, z fontem zastępczym systemu).
      - name: Instalacja fontów do grafik
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter

      - name: Uruchomienie bota cen paliw
        if: steps.check.outputs.skip != 'true'
        run: node runActionsBot.js
        env:
          # Wyłączamy tryb symulacji w GitHub Actions, aby bot publikował na żywo
          MOCK_MODE: 'false'
          BRANDING_TEXT: '@MaksymalneCenyPaliw'
          
          # Klucze API Twitter / X (przekazywane z bezpiecznych GitHub Secrets)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_API_ACCESS_TOKEN: ${{ secrets.X_API_ACCESS_TOKEN }}
          X_API_ACCESS_TOKEN_SECRET: ${{ secrets.X_API_ACCESS_TOKEN_SECRET }}
          
          # Klucze API Meta (Facebook & Instagram)
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_BUSINESS_ID: ${{ secrets.META_INSTAGRAM_BUSINESS_ID }}
          
          # Klucz API hostingu ImgBB
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}

          # Pośrednik na Cloudflare Workers (cloudflare/worker.js) - Monitor Polski nie przyjmuje połączeń z serwerów GitHuba w USA
          MP_PROXY_URL: ${{ secrets.MP_PROXY_URL }}
          MP_PROXY_KEY: ${{ secrets.MP_PROXY_KEY }}

      - name: Zapisanie stanu bota (db.json)
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.json
          # Sprawdź, czy plik db.json ma zmiany gotowe do zatwierdzenia (staged)
          git diff --cached --quiet || (git commit -m "chore: aktualizacja stanu bota [skip ci]" && git push)
